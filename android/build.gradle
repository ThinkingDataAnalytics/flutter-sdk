group 'cn.thinkingdata.flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // 保持较低版本，由宿主工程实际 AGP 主导；避免锁死到 8.x 导致老 Flutter(Gradle 7.3) 不可用
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // AGP 8+ 需要 namespace；老版本无此属性则跳过
    if (project.android.hasProperty("namespace")) {
        namespace 'cn.thinkingdata.flutter'
    }
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 19
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'cn.thinkingdata.android:ThinkingAnalyticsSDK:3.4.4'
    implementation 'cn.thinkingdata.android:TAThirdParty:2.0.2'
}
